[project]
name = "daily-hub"
version = "0.1.0"
description = "Daily-task hub for mobile games on PC (游戏日常总控)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.11,<6.12",
    "psutil>=7.0",
    "ruamel-yaml>=0.18",
]

[project.scripts]
daily-hub = "daily_hub.cli:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daily_hub"]

